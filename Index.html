<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMX Swing Assistant v1.0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:15px;color:#222}.card{background:white;padding:15px;margin-bottom:15px;border-radius:15px}button{width:100%;padding:14px;font-size:17px;border:0;border-radius:10px;background:#222;color:white}.status{min-height:20px;color:#555}.log{background:#181818;color:#ddd;padding:12px;border-radius:10px;font:12px monospace;white-space:pre-wrap;max-height:200px;overflow:auto}.result{padding:12px 0;border-bottom:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;color:#555}.buy{color:green;font-weight:bold}.watch{color:#b88600;font-weight:bold}.wait{color:red;font-weight:bold}</style></head><body><h1>📈 OMX Swing Assistant</h1><div class="card"><b>v1.0 • OMXS30 Scanner</b><p><button id="b" onclick="scan()">🔎 Scanna OMXS30</button></p><div id="s" class="status">Redo</div></div><div class="card"><b>Resultat</b><div id="r">Ingen scanning gjord.</div></div><div class="card"><b>Debug</b><div id="l" class="log">v1.0 startad.</div></div><script>
const stocks=["ABB.ST","ALFA.ST","ASSA-B.ST","ATCO-A.ST","AZN.ST","BOL.ST","ELUX-B.ST","ERIC-B.ST","EVO.ST","HEXA-B.ST","HM-B.ST","INVE-B.ST","KINV-B.ST","NDA-SE.ST","SAND.ST","SCA-B.ST","SEB-A.ST","SHB-A.ST","SINCH.ST","SKF-B.ST","SWED-A.ST","TEL2-B.ST","TELIA.ST","VOLV-B.ST"];
const proxy="https://corsproxy.io/?url=";
const $=x=>document.getElementById(x);
function log(x){$("l").textContent+="\n["+new Date().toLocaleTimeString("sv-SE")+"] "+x}
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}
function RSI(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}if(!l)return 100;let q=(g/n)/(l/n);return 100-100/(1+q)}
async function data(t){let u="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(t)+"?range=1y&interval=1d";let c=new AbortController(),tm=setTimeout(()=>c.abort(),15000);try{let x=await fetch(proxy+encodeURIComponent(u),{cache:"no-store",signal:c.signal});if(!x.ok)throw Error("HTTP "+x.status);let j=await x.json(),q=j?.chart?.result?.[0],a=(q?.indicators?.quote?.[0]?.close||[]).filter(Number.isFinite);if(!q)throw Error("Inget Yahoo-resultat");if(a.length<200)throw Error("För få datapunkter");return a}catch(e){if(e.name==="AbortError")throw Error("Timeout 15 s");throw e}finally{clearTimeout(tm)}}
function analyse(a,ix){let p=a.at(-1),m50=avg(a.slice(-50)),m200=avg(a.slice(-200)),rs=RSI(a),six=(p-a.at(-126))/a.at(-126)*100,rel=six-ix,sc=0;if(p>m200)sc+=25;if(m50>m200)sc+=10;if(rs<35)sc+=15;else if(rs<45)sc+=8;if(rel>=10)sc+=25;else if(rel>=5)sc+=15;else if(rel>=0)sc+=8;if(p>m50)sc+=10;let sig=sc>=85?"KÖP":sc>=70?"BEVAKA":"AVVAKTA";return{p,m50,m200,rs,six,rel,sc,sig}}
async function scan(){let b=$("b");b.disabled=true;$("r").innerHTML="";$("l").textContent="v1.0 startad.";try{$("s").textContent="Hämtar OMXS30-index...";let a=await data("^OMXS30"),ix=(a.at(-1)-a.at(-126))/a.at(-126)*100,all=[];log("OMXS30 6 mån: "+ix.toFixed(2)+"%");for(let i=0;i<stocks.length;i++){let t=stocks[i];$("s").textContent="Analyserar "+(i+1)+"/"+stocks.length+" : "+t;try{let d=analyse(await data(t),ix);all.push({t,d});log(t+" OK • score "+d.sc)}catch(e){log(t+" FEL • "+e.message)}}all.sort((x,y)=>y.d.sc-x.d.sc);$("r").innerHTML=all.length?all.map(x=>{let d=x.d,c=d.sc>=85?"buy":d.sc>=70?"watch":"wait";return `<div class="result"><b>${x.t}</b> <span class="${c}">${d.sc}/100 • ${d.sig}</span><div class="grid"><div>Kurs ${d.p.toFixed(2)}</div><div>RSI ${d.rs.toFixed(1)}</div><div>MA50 ${d.m50.toFixed(2)}</div><div>MA200 ${d.m200.toFixed(2)}</div><div>6 mån ${d.six.toFixed(1)}%</div><div>Relativ ${d.rel.toFixed(1)}%</div></div></div>`}).join(""):"<span class='wait'>Ingen aktie kunde analyseras. Se Debug.</span>";$("s").textContent="Klart - "+all.length+" aktier analyserade av "+stocks.length}catch(e){$("s").textContent="Scanning stoppad: "+e.message;log("FEL: "+e.message);$("r").innerHTML="<span class='wait'>"+e.message+"</span>"}finally{b.disabled=false}}
</script></body></html>
