name: Samla backtest-data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repo
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installera paket
        run: pip install yfinance pandas

      - name: Hämta 5 års historik
        run: python backtest.py

      - name: Kör backtest
        run: python run_backtest.py

      - name: Kör ranked backtest
        run: python ranked_backtest.py

            - name: Spara resultat
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/backtest_data.json data/backtest_results.json data/ranked_backtest_results.json
          git commit -m "Update backtest results" || echo "No changes"
          git push
