<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMX Swing Scanner v1.1</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#111}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0 0 4px}.small{color:#666;font-size:14px}button{padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;margin:16px 0}#status{padding:12px;background:#fff;border-radius:10px;margin-bottom:16px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#eee}.buy,.watch{font-weight:700}</style></head><body><main>
<h1>OMX Swing Scanner</h1><div class="small">v1.1 – GitHub Actions + lokal JSON-data</div><button onclick="scan()">Kör scanning</button><div id="status">Laddar data...</div>
<table><thead><tr><th>Aktie</th><th>Pris</th><th>Score</th><th>Signal</th></tr></thead><tbody id="results"></tbody></table></main><script>
const T=["ABB.ST","ALFA.ST","ASSA-B.ST","ATCO-A.ST","AZN.ST","BOL.ST","ELUX-B.ST","ERIC-B.ST","EVO.ST","HEXA-B.ST","HM-B.ST","INVE-B.ST","KINV-B.ST","NDA-SE.ST","SAND.ST","SCA-B.ST","SEB-A.ST","SHB-A.ST","SINCH.ST","SKF-B.ST","SWED-A.ST","TEL2-B.ST","TELIA.ST","VOLV-B.ST"];
const sma=(a,n)=>a.length<n?null:a.slice(-n).reduce((x,y)=>x+y,0)/n;
function rsi(a,n=14){if(a.length<n+1)return null;let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}if(!l)return 100;let rs=(g/n)/(l/n);return 100-100/(1+rs)}
function score(p,b){let x=p.at(-1),m50=sma(p,50),m200=sma(p,200),r=rsi(p);if(m50==null||m200==null||r==null)return null;let s=0;if(x>m200)s+=25;if(m50>m200)s+=10;if(r<35)s+=15;else if(r<45)s+=8;if(x>m50)s+=10;if(b.length>=127){let rel=(x/p.at(-127)-1)-(b.at(-1)/b.at(-127)-1);if(rel>=.1)s+=25;else if(rel>=.05)s+=15;else if(rel>=0)s+=8}return Math.min(100,s)}
async function scan(){let st=document.getElementById("status"),tb=document.getElementById("results");tb.innerHTML="";st.textContent="Hämtar sparad marknadsdata...";try{let r=await fetch("data/stocks.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json(),s=d.stocks||{},b=(s["^OMXS30"]||[]).map(x=>x.close),n=0;for(let t of T){if(!s[t]||s[t].length<200)continue;let p=s[t].map(x=>x.close),v=score(p,b);if(v==null)continue;let q=v>=85?"KÖP":v>=70?"BEVAKA":"AVVAKTA",tr=document.createElement("tr");tr.innerHTML="<td>"+t.replace(".ST","")+"</td><td>"+p.at(-1).toFixed(2)+"</td><td>"+v+"</td><td class='"+(q=="KÖP"?"buy":q=="BEVAKA"?"watch":"")+"'>"+q+"</td>";tb.appendChild(tr);n++}st.textContent="Klart – "+n+" aktier analyserade. Data: "+(d.generated_at_utc?new Date(d.generated_at_utc).toLocaleString("sv-SE"):"okänt")}catch(e){st.textContent="Fel: "+e.message+". Kör GitHub Action 'Uppdatera OMX-data' först."}}scan();
</script></body></html>
