<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMX Swing Scanner v1.3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f5f5f5;margin:0;color:#222}.container{max-width:900px;margin:auto;padding:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:600}.status{color:#666;margin:12px 0}
.stock{background:#fff;border-radius:12px;margin:8px 0;padding:13px;display:grid;grid-template-columns:1fr auto;cursor:pointer;box-shadow:0 1px 3px #ddd}
.name{font-weight:700}.price{font-size:13px;color:#666}.score{font-size:22px;font-weight:800;text-align:right}.signal{font-size:12px;font-weight:700;text-align:right}
.buy{color:#16803c}.watch{color:#b77900}.wait{color:#c62828}#detail{background:#fff;border-radius:14px;padding:16px;margin-top:14px;display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f5f5f5;padding:10px;border-radius:9px}.metric b{display:block;font-size:17px}
.points div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}.small{font-size:12px;color:#666}
</style></head><body><div class="container">
<h1>OMX Swing Scanner v1.3</h1><button id="scan">Kör scanning / uppdatera</button><div id="status" class="status">Läser data…</div><div id="list"></div><div id="detail"></div>
</div><script>
const T=["ABB.ST","ALFA.ST","ASSA-B.ST","ATCO-A.ST","AZN.ST","BOL.ST","ELUX-B.ST","ERIC-B.ST","EVO.ST","HEXA-B.ST","HM-B.ST","INVE-B.ST","KINV-B.ST","NDA-SE.ST","SAND.ST","SCA-B.ST","SEB-A.ST","SHB-A.ST","SINCH.ST","SKF-B.ST","SWED-A.ST","TEL2-B.ST","TELIA.ST","VOLV-B.ST"];let results=[];
function dk(v){if(v==null)return"";if(typeof v==="number"||/^\d+$/.test(String(v))){let n=Number(v),d=new Date(n<1e12?n*1000:n);if(!isNaN(d))return d.toISOString().slice(0,10)}let d=new Date(String(v));return isNaN(d)?"":d.toISOString().slice(0,10)}
function cl(r){if(r&&!Array.isArray(r)){if(Array.isArray(r.close)){let d=r.date||r.dates||r.Date||[];return r.close.map((x,i)=>({date:dk(d[i]),close:+x})).filter(x=>isFinite(x.close))}r=r.prices||r.data}if(!Array.isArray(r))return[];return r.map(x=>typeof x==="number"?{date:"",close:x}:{date:dk(x.date??x.Date??x.timestamp??x.time),close:+(x.close??x.Close??x.price)}).filter(x=>isFinite(x.close))}
function sma(a,n){if(a.length<n)return NaN;let s=0;for(let i=a.length-n;i<a.length;i++)s+=a[i].close;return s/n}
function rsi(a,n=14){if(a.length<n+1)return NaN;let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i].close-a[i-1].close;d>0?g+=d:l-=d}return l?100-100/(1+g/l):100}
function rs(a,b){if(a.length<127||b.length<127)return NaN;let m=new Map(b.filter(x=>x.date).map(x=>[x.date,x.close])),e=a.at(-1),eb=m.get(e.date);if(!isFinite(eb))return NaN;for(let i=Math.max(0,a.length-127);i>=0;i--){let s=a[i],bb=m.get(s.date);if(isFinite(bb))return((e.close/s.close)/(eb/bb)-1)*100}return NaN}
function vol(a,n=14){if(a.length<n+1)return NaN;let s=0;for(let i=a.length-n;i<a.length;i++)s+=Math.abs(a[i].close-a[i-1].close);return s/n/a.at(-1).close*100}
function pb(a,n=20){if(a.length<n)return NaN;let h=Math.max(...a.slice(-n).map(x=>x.close));return(1-a.at(-1).close/h)*100}
function calc(t,a,b){if(a.length<200)return null;let p=a.at(-1).close,m50=sma(a,50),m200=sma(a,200),R=rsi(a),q=rs(a,b),v=vol(a),pback=pb(a),trend=(p>m200?25:0)+(m50>m200?10:0),rp=R<35?15:R<45?8:0,rsp=q>=10?25:q>=5?15:q>=0?8:0,mom=p>m50?10:0,vp=v>=1.5?10:v>=1?7:v>=.7?4:0,pp=pback>=5&&pback<=15?10:pback>=3?6:0,score=Math.min(100,trend+rp+rsp+mom+vp+pp);return{ticker:t,price:p,ma50:m50,ma200:m200,rsi:R,rs:q,vol:v,pb:pback,score,signal:score>=85?"KÖP":score>=70?"BEVAKA":"AVVAKTA",points:{trend,rsi:rp,relative:rsp,momentum:mom,volatility:vp,pullback:pp}}}
function f(x){return isFinite(x)?x.toFixed(2):"—"}
function render(){let l=document.getElementById("list");l.innerHTML="";results.sort((a,b)=>b.score-a.score).forEach((x,i)=>{let e=document.createElement("div");e.className="stock";let c=x.signal==="KÖP"?"buy":x.signal==="BEVAKA"?"watch":"wait";e.innerHTML=`<div><b>${i+1}. ${x.ticker}</b><div class="price">Pris ${f(x.price)} kr</div></div><div><div class="score">${x.score}</div><div class="signal ${c}">${x.signal}</div></div>`;e.onclick=()=>show(x);l.appendChild(e)})}
function show(x){let d=document.getElementById("detail"),c=x.signal==="KÖP"?"buy":x.signal==="BEVAKA"?"watch":"wait";d.style.display="block";d.innerHTML=`<h2>${x.ticker}</h2><div class="grid"><div class="metric">Pris<b>${f(x.price)} kr</b></div><div class="metric">Score<b class="${c}">${x.score} – ${x.signal}</b></div><div class="metric">RSI 14<b>${f(x.rsi)}</b></div><div class="metric">MA50<b>${f(x.ma50)}</b></div><div class="metric">MA200<b>${f(x.ma200)}</b></div><div class="metric">Relativ styrka<b>${f(x.rs)}%</b></div><div class="metric">Volatilitet<b>${f(x.vol)}%</b></div><div class="metric">20d rekyl<b>${f(x.pb)}%</b></div></div><h3>Poäng</h3><div class="points"><div>Trend <b>${x.points.trend}/35</b></div><div>RSI <b>${x.points.rsi}/15</b></div><div>Relativ styrka <b>${x.points.relative}/25</b></div><div>Momentum <b>${x.points.momentum}/10</b></div><div>Volatilitet <b>${x.points.volatility}/10</b></div><div>Rekyl <b>${x.points.pullback}/10</b></div></div><p class="small">Relativ styrka matchas mot OMXS30 på gemensamma datum. Volatilitet och rekyl används för att hitta faktisk swing-potential.</p>`;d.scrollIntoView({behavior:"smooth"})}
async function run(){document.getElementById("status").textContent="Läser senaste stocks.json…";try{let r=await fetch("data/stocks.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json(),m={};if(Array.isArray(d))d.forEach(x=>m[x.ticker||x.symbol]=x);else if(Array.isArray(d.stocks))d.stocks.forEach(x=>m[x.ticker||x.symbol]=x);else m=d;let b=cl(m["^OMXS30"]||d.benchmark);results=T.map(t=>calc(t,cl(m[t]),b)).filter(Boolean);render();document.getElementById("status").textContent=`Klart – ${results.length} aktier analyserade`}catch(e){document.getElementById("status").textContent="Fel: "+e.message}}
document.getElementById("scan").onclick=run;run();
</script></body></html>
