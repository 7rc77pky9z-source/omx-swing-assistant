<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>OMX Swing Assistant v1.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:25px;margin:8px 0 2px}.sub{color:#6b7280;font-size:13px;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #00000012}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;background:#111827;color:#fff}
button:disabled{opacity:.55}
.status{margin-top:12px;font-size:14px;color:#374151;min-height:20px}
.log{background:#111827;color:#d1d5db;border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:180px;overflow:auto}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:0}.name{font-weight:750}.muted{color:#6b7280;font-size:12px}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;margin-top:4px}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.score{font-size:20px;font-weight:800}
.small{font-size:12px;color:#6b7280}
</style>
</head>
<body>
<main>
<h1>📈 OMX Swing Assistant</h1>
<div class="sub">v1.0 • Core / datatest</div>

<div class="card">
<button id="testBtn" onclick="runTest()">Testa dataanslutning</button>
<div id="status" class="status">Redo</div>
</div>

<div class="card">
<div style="font-weight:750;margin-bottom:10px">Testresultat</div>
<div id="result"><span class="small">Ingen test körd ännu.</span></div>
</div>

<div class="card">
<div style="font-weight:750;margin-bottom:10px">Debug</div>
<div id="log" class="log">v1.0 startad.</div>
</div>
</main>

<script>
const VERSION="1.0";
const TEST_SYMBOL="VOLV-B.ST";

/*
 v1.0 Core:
 - Ingen Yahoo Finance
 - Ingen API-nyckel
 - Data testas via Stooq CSV-endpoint genom en enkel CORS-lösning.
 - Strategimotorn läggs på först när dataflödet är verifierat.
*/

function log(msg){
  const el=document.getElementById("log");
  const time=new Date().toLocaleTimeString("sv-SE");
  el.textContent += "\\n["+time+"] "+msg;
  el.scrollTop=el.scrollHeight;
}

function setStatus(msg){document.getElementById("status").textContent=msg}

function calcSMA(a,n){
  if(a.length<n)return null;
  let s=0;
  for(let i=a.length-n;i<a.length;i++)s+=a[i];
  return s/n;
}

function calcRSI(a,n=14){
  if(a.length<n+1)return null;
  let gain=0,loss=0;
  for(let i=a.length-n;i<a.length;i++){
    const d=a[i]-a[i-1];
    if(d>0)gain+=d; else loss-=d;
  }
  if(loss===0)return 100;
  const rs=(gain/n)/(loss/n);
  return 100-100/(1+rs);
}

function makeScore(data){
  let score=0;
  if(data.price>data.ma200)score+=25;
  if(data.ma50>data.ma200)score+=20;
  if(data.rsi!==null && data.rsi>=40 && data.rsi<=65)score+=15;
  if(data.sixMonth>0)score+=20;
  if(data.price>data.ma50)score+=20;
  score=Math.min(100,score);
  let signal=score>=80?"KÖP":score>=65?"BEVAKA":"AVVAKTA";
  return {score,signal};
}

/*
 Stooq-symboler skrivs normalt med punktformat, t.ex. volv-b.se.
 Vi använder en allmän CORS-proxy för testfasen. Ingen nyckel krävs.
 Detta är avsiktligt endast en datatestversion; en mer permanent
 serverlösning kan bytas in utan att ändra Swing Score-koden.
*/
async function fetchCSV(symbol){
  const stooq=symbol.toLowerCase().replace(".st","");
  const url="https://stooq.com/q/d/l/?s="+encodeURIComponent(stooq+".se")+"&d1=20200101&d2=20991231&i=d";
  const proxy="https://api.allorigins.win/raw?url="+encodeURIComponent(url);

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);

  try{
    const response=await fetch(proxy,{signal:controller.signal,cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const text=await response.text();
    if(!text || text.includes("No data"))throw new Error("Ingen kursdata");
    return text;
  }finally{
    clearTimeout(timer);
  }
}

function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<20)throw new Error("För få datapunkter");
  const header=lines.shift().split(",");
  const closeIndex=header.findIndex(x=>x.trim().toLowerCase()==="close");
  if(closeIndex<0)throw new Error("Close-kolumn saknas");
  const closes=[];
  for(const line of lines){
    const p=line.split(",");
    const v=Number(p[closeIndex]);
    if(Number.isFinite(v))closes.push(v);
  }
  if(closes.length<200)throw new Error("Behöver minst 200 handelsdagar");
  return closes;
}

async function runTest(){
  const btn=document.getElementById("testBtn");
  const result=document.getElementById("result");
  btn.disabled=true;
  result.innerHTML="";
  document.getElementById("log").textContent="v1.0 startad.";

  try{
    setStatus("Testar VOLV-B...");
    log("Startar datahämtning för "+TEST_SYMBOL);

    const csv=await fetchCSV(TEST_SYMBOL);
    log("CSV mottagen: "+csv.length+" tecken");

    const closes=parseCSV(csv);
    log("Antal handelsdagar: "+closes.length);

    const price=closes[closes.length-1];
    const ma50=calcSMA(closes,50);
    const ma200=calcSMA(closes,200);
    const rsi=calcRSI(closes,14);
    const old=closes[closes.length-126];
    const sixMonth=(price-old)/old*100;
    const score=makeScore({price,ma50,ma200,rsi,sixMonth});

    setStatus("Dataanslutning fungerar ✓");
    result.innerHTML=`
      <div class="row"><div><div class="name">VOLV-B</div><div class="muted">Testaktie</div></div><div class="score">${price.toFixed(2)}</div></div>
      <div class="row"><div>MA50</div><div>${ma50.toFixed(2)}</div></div>
      <div class="row"><div>MA200</div><div>${ma200.toFixed(2)}</div></div>
      <div class="row"><div>RSI14</div><div>${rsi.toFixed(1)}</div></div>
      <div class="row"><div>6 mån</div><div>${sixMonth.toFixed(1)}%</div></div>
      <div class="row"><div>Swing Score</div><div><span class="pill ok">${score.score}/100 • ${score.signal}</span></div></div>`;
    log("Indikatorer beräknade.");
    log("v1.0 CORE TEST OK");
  }catch(e){
    setStatus("Dataanslutningen misslyckades");
    result.innerHTML=`<span class="pill bad">FEL</span><div style="margin-top:8px">${escapeHtml(e.message||String(e))}</div>`;
    log("FEL: "+(e.message||String(e)));
    log("Testet avbröts utan att krascha appen.");
  }finally{
    btn.disabled=false;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
