<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMX Swing Scanner v1.4</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
  background:#f5f5f5;
  margin:0;
  color:#222
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px
}

button{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-weight:600
}

.status{
  color:#666;
  margin:12px 0
}

.update{
  background:#e9ecef;
  border-radius:10px;
  padding:9px 12px;
  margin:10px 0 14px;
  color:#495057;
  font-size:14px
}

.stock{
  background:#fff;
  border-radius:12px;
  margin:8px 0;
  padding:13px;
  display:grid;
  grid-template-columns:1fr auto;
  cursor:pointer;
  box-shadow:0 1px 3px #ddd
}

.name{
  font-weight:700
}

.price{
  font-size:13px;
  color:#666
}

.score{
  font-size:22px;
  font-weight:800;
  text-align:right
}

.signal{
  font-size:12px;
  font-weight:700;
  text-align:right
}

.buy{
  color:#16803c
}

.watch{
  color:#b77900
}

.wait{
  color:#c62828
}

#detail{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-top:14px;
  display:none
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.metric{
  background:#f5f5f5;
  padding:10px;
  border-radius:9px
}

.metric b{
  display:block;
  font-size:17px
}

.points div{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #eee
}

.small{
  font-size:12px;
  color:#666
}

.error{
  background:#f8d7da;
  color:#842029;
  padding:10px 12px;
  border-radius:10px;
  margin:10px 0
}
</style>
</head>

<body>

<div class="container">

<h1>OMX Swing Scanner v1.4</h1>

<button id="scan">Kör scanning / uppdatera</button>

<div id="status" class="status">
Läser data…
</div>

<div id="dataStatus" class="update">
Senast uppdaterad: läser data…
</div>

<div id="list"></div>

<div id="detail"></div>

</div>

<script>

const T=[
"ABB.ST",
"ALFA.ST",
"ASSA-B.ST",
"ATCO-A.ST",
"AZN.ST",
"BOL.ST",
"ELUX-B.ST",
"ERIC-B.ST",
"EVO.ST",
"HEXA-B.ST",
"HM-B.ST",
"INVE-B.ST",
"KINV-B.ST",
"NDA-SE.ST",
"SAND.ST",
"SCA-B.ST",
"SEB-A.ST",
"SHB-A.ST",
"SINCH.ST",
"SKF-B.ST",
"SWED-A.ST",
"TEL2-B.ST",
"TELIA.ST",
"VOLV-B.ST"
];

let results=[];


/* --------------------------------------------------
   Datum
-------------------------------------------------- */

function dk(v){

  if(v==null) return "";

  if(
    typeof v==="number" ||
    /^\d+$/.test(String(v))
  ){

    let n=Number(v);

    let d=new Date(
      n<1e12 ? n*1000 : n
    );

    if(!isNaN(d.getTime())){
      return d.toISOString().slice(0,10);
    }
  }

  let d=new Date(String(v));

  if(!isNaN(d.getTime())){
    return d.toISOString().slice(0,10);
  }

  return "";
}


/* --------------------------------------------------
   Prisdata
-------------------------------------------------- */

function cl(r){

  if(!r) return [];


  /*
    Format:

    {
      close:[...],
      date:[...]
    }
  */

  if(!Array.isArray(r)){

    if(Array.isArray(r.close)){

      let d=
        r.date ||
        r.dates ||
        r.Date ||
        r.timestamp ||
        r.timestamps ||
        [];

      return r.close
        .map((x,i)=>({

          date:dk(d[i]),

          close:+x

        }))
        .filter(x=>isFinite(x.close));
    }


    /*
      Format:

      {
        prices:[...]
      }

      eller

      {
        data:[...]
      }
    */

    r=r.prices || r.data || r.values || [];
  }


  if(!Array.isArray(r)) return [];


  return r
    .map(x=>{

      if(typeof x==="number"){

        return {
          date:"",
          close:x
        };
      }


      if(x && typeof x==="object"){

        return {

          date:dk(
            x.date ??
            x.Date ??
            x.timestamp ??
            x.time ??
            x.datetime
          ),

          close:+(
            x.close ??
            x.Close ??
            x.price ??
            x.Price ??
            x.value
          )

        };
      }


      return {
        date:"",
        close:NaN
      };

    })
    .filter(x=>isFinite(x.close));
}


/* --------------------------------------------------
   SMA
-------------------------------------------------- */

function sma(a,n){

  if(a.length<n) return NaN;

  let s=0;

  for(
    let i=a.length-n;
    i<a.length;
    i++
  ){

    s+=a[i].close;
  }

  return s/n;
}


/* --------------------------------------------------
   RSI
-------------------------------------------------- */

function rsi(a,n=14){

  if(a.length<n+1) return NaN;

  let g=0;
  let l=0;

  for(
    let i=a.length-n;
    i<a.length;
    i++
  ){

    let d=
      a[i].close -
      a[i-1].close;

    if(d>0)
      g+=d;
    else
      l-=d;
  }

  return l
    ? 100-100/(1+g/l)
    : 100;
}


/* --------------------------------------------------
   Relativ styrka
-------------------------------------------------- */

function rs(a,b){

  if(
    a.length<127 ||
    b.length<127
  ){
    return NaN;
  }


  /*
    Benchmark-index på datum
  */

  let m=new Map(
    b
      .filter(x=>x.date)
      .map(x=>[
        x.date,
        x.close
      ])
  );


  let e=a.at(-1);

  if(!e || !e.date){
    return NaN;
  }


  let eb=m.get(e.date);

  if(!isFinite(eb)){
    return NaN;
  }


  /*
    Leta bakåt efter första
    gemensamma datum inom ca 6 månader.
  */

  for(
    let i=Math.max(0,a.length-127);
    i>=0;
    i--
  ){

    let s=a[i];

    if(!s || !s.date)
      continue;

    let bb=m.get(s.date);

    if(isFinite(bb)){

      return (
        (e.close/s.close) /
        (eb/bb) -
        1
      ) * 100;
    }
  }


  return NaN;
}


/* --------------------------------------------------
   Volatilitet
-------------------------------------------------- */

function vol(a,n=14){

  if(a.length<n+1)
    return NaN;

  let s=0;

  for(
    let i=a.length-n;
    i<a.length;
    i++
  ){

    s+=Math.abs(
      a[i].close -
      a[i-1].close
    );
  }

  return (
    s/n /
    a.at(-1).close
  ) * 100;
}


/* --------------------------------------------------
   Pullback / rekyl
-------------------------------------------------- */

function pb(a,n=20){

  if(a.length<n)
    return NaN;

  let h=Math.max(
    ...a
      .slice(-n)
      .map(x=>x.close)
  );

  return (
    1 -
    a.at(-1).close/h
  ) * 100;
}


/* --------------------------------------------------
   Score
-------------------------------------------------- */

function calc(t,a,b){

  if(!a || a.length<200)
    return null;


  let p=a.at(-1).close;

  let m50=sma(a,50);

  let m200=sma(a,200);

  let R=rsi(a);

  let q=rs(a,b);

  let v=vol(a);

  let pback=pb(a);


  /*
    Trend 35
  */

  let trend=
    (p>m200 ? 25 : 0) +
    (m50>m200 ? 10 : 0);


  /*
    RSI 15
  */

  let rp=
    R<35
      ? 15
      : R<45
        ? 8
        : 0;


  /*
    Relativ styrka 25
  */

  let rsp=
    q>=10
      ? 25
      : q>=5
        ? 15
        : q>=0
          ? 8
          : 0;


  /*
    Momentum 10
  */

  let mom=
    p>m50
      ? 10
      : 0;


  /*
    Volatilitet 10
  */

  let vp=
    v>=1.5
      ? 10
      : v>=1
        ? 7
        : v>=.7
          ? 4
          : 0;


  /*
    Pullback 10
  */

  let pp=
    pback>=5 && pback<=15
      ? 10
      : pback>=3
        ? 6
        : 0;


  let score=Math.min(
    100,
    trend+
    rp+
    rsp+
    mom+
    vp+
    pp
  );


  return {

    ticker:t,

    price:p,

    ma50:m50,

    ma200:m200,

    rsi:R,

    rs:q,

    vol:v,

    pb:pback,

    score:score,

    signal:
      score>=85
        ? "KÖP"
        : score>=70
          ? "BEVAKA"
          : "AVVAKTA",

    points:{

      trend:trend,

      rsi:rp,

      relative:rsp,

      momentum:mom,

      volatility:vp,

      pullback:pp

    }

  };
}


/* --------------------------------------------------
   Formatter
-------------------------------------------------- */

function f(x){

  return isFinite(x)
    ? x.toFixed(2)
    : "—";
}


/* --------------------------------------------------
   Uppdateringstid
-------------------------------------------------- */

function updateDataStatus(data){

  let el=
    document.getElementById(
      "dataStatus"
    );

  if(!el)
    return;


  let value=null;


  if(
    data &&
    typeof data==="object"
  ){

    value=
      data.updated_at ??
      data.updatedAt ??
      data.last_updated ??
      data.lastUpdated ??
      data.generated_at ??
      data.generatedAt ??
      data.timestamp ??
      null;


    /*
      Metadata om fetch_data.py
      använder ett sådant objekt.
    */

    if(
      !value &&
      data.metadata &&
      typeof data.metadata==="object"
    ){

      value=
        data.metadata.updated_at ??
        data.metadata.updatedAt ??
        data.metadata.last_updated ??
        data.metadata.lastUpdated ??
        data.metadata.generated_at ??
        data.metadata.generatedAt ??
        data.metadata.timestamp ??
        null;
    }
  }


  if(value){

    let d=new Date(value);


    if(!isNaN(d.getTime())){

      el.textContent=
        "Senast uppdaterad: " +
        d.toLocaleString(
          "sv-SE",
          {
            dateStyle:"short",
            timeStyle:"short"
          }
        );

      return;
    }


    el.textContent=
      "Senast uppdaterad: " +
      String(value);

    return;
  }


  /*
    Om stocks.json inte innehåller
    timestamp visar vi när filen
    faktiskt hämtades.
  */

  el.textContent=
    "Data hämtad: " +
    new Date().toLocaleString(
      "sv-SE",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );
}


/* --------------------------------------------------
   Render
-------------------------------------------------- */

function render(){

  let l=
    document.getElementById(
      "list"
    );

  l.innerHTML="";


  results
    .sort(
      (a,b)=>
        b.score-a.score
    )
    .forEach((x,i)=>{

      let e=
        document.createElement(
          "div"
        );


      e.className="stock";


      let c=
        x.signal==="KÖP"
          ? "buy"
          : x.signal==="BEVAKA"
            ? "watch"
            : "wait";


      e.innerHTML=`

        <div>

          <b>
            ${i+1}. ${x.ticker}
          </b>

          <div class="price">
            Pris ${f(x.price)} kr
          </div>

        </div>

        <div>

          <div class="score">
            ${x.score}
          </div>

          <div class="signal ${c}">
            ${x.signal}
          </div>

        </div>
      `;


      e.onclick=()=>show(x);

      l.appendChild(e);

    });
}


/* --------------------------------------------------
   Detalj
-------------------------------------------------- */

function show(x){

  let d=
    document.getElementById(
      "detail"
    );


  let c=
    x.signal==="KÖP"
      ? "buy"
      : x.signal==="BEVAKA"
        ? "watch"
        : "wait";


  d.style.display="block";


  d.innerHTML=`

    <h2>
      ${x.ticker}
    </h2>

    <div class="grid">

      <div class="metric">
        Pris
        <b>
          ${f(x.price)} kr
        </b>
      </div>

      <div class="metric">
        Score
        <b class="${c}">
          ${x.score} – ${x.signal}
        </b>
      </div>

      <div class="metric">
        RSI 14
        <b>
          ${f(x.rsi)}
        </b>
      </div>

      <div class="metric">
        MA50
        <b>
          ${f(x.ma50)}
        </b>
      </div>

      <div class="metric">
        MA200
        <b>
          ${f(x.ma200)}
        </b>
      </div>

      <div class="metric">
        Relativ styrka
        <b>
          ${f(x.rs)}%
        </b>
      </div>

      <div class="metric">
        Volatilitet
        <b>
          ${f(x.vol)}%
        </b>
      </div>

      <div class="metric">
        20d rekyl
        <b>
          ${f(x.pb)}%
        </b>
      </div>

    </div>


    <h3>
      Poäng
    </h3>


    <div class="points">

      <div>
        Trend
        <b>
          ${x.points.trend}/35
        </b>
      </div>

      <div>
        RSI
        <b>
          ${x.points.rsi}/15
        </b>
      </div>

      <div>
        Relativ styrka
        <b>
          ${x.points.relative}/25
        </b>
      </div>

      <div>
        Momentum
        <b>
          ${x.points.momentum}/10
        </b>
      </div>

      <div>
        Volatilitet
        <b>
          ${x.points.volatility}/10
        </b>
      </div>

      <div>
        Rekyl
        <b>
          ${x.points.pullback}/10
        </b>
      </div>

    </div>


    <p class="small">
      Relativ styrka matchas mot OMXS30
      på gemensamma datum.
      Volatilitet och rekyl används
      för att hitta faktisk swing-potential.
    </p>
  `;


  d.scrollIntoView({
    behavior:"smooth"
  });
}


/* --------------------------------------------------
   Läs data och kör scanning
-------------------------------------------------- */

async function run(){

  let status=
    document.getElementById(
      "status"
    );

  let list=
    document.getElementById(
      "list"
    );

  let detail=
    document.getElementById(
      "detail"
    );


  status.textContent=
    "Läser senaste stocks.json…";


  list.innerHTML="";


  detail.style.display="none";


  try{

    /*
      Date.now() + no-store
      säkerställer att webbläsaren
      inte använder gammal cache.
    */

    let url=
      "data/stocks.json?ts=" +
      Date.now();

let controller = new AbortController();

let timeout = setTimeout(
  () => controller.abort(),
  10000
);

let r;

try{

  r = await fetch(
    url,
    {
      cache:"no-store",
      signal:controller.signal
    }
  );

}
finally{

  clearTimeout(timeout);

}


    if(!r.ok){

      throw Error(
        "HTTP " + r.status
      );
    }


    let d=
      await r.json();


    updateDataStatus(d);


    /*
      Bygg ticker-map.
    */

    let m={};


    if(Array.isArray(d)){

      d.forEach(x=>{

        if(!x)
          return;

        let ticker=
          x.ticker ||
          x.symbol ||
          x.Ticker ||
          x.Symbol;

        if(ticker)
          m[ticker]=x;

      });

    }


    else if(
      d &&
      Array.isArray(d.stocks)
    ){

      d.stocks.forEach(x=>{

        if(!x)
          return;

        let ticker=
          x.ticker ||
          x.symbol ||
          x.Ticker ||
          x.Symbol;

        if(ticker)
          m[ticker]=x;

      });

    }


    else if(
      d &&
      typeof d==="object"
    ){

      /*
        Om stocks.json är ett objekt
        där tickern ligger direkt som nyckel.
      */

      m=d;
    }


    /*
      Hitta OMXS30.
    */

    let benchmarkRaw=
      m["^OMXS30"] ||
      m["OMXS30"] ||
      m["omxs30"] ||
      (
        d &&
        d.benchmark
      );


    let b=
      cl(benchmarkRaw);


-data saknas eller innehåller för få datapunkter."
    

    /*
      Kör samtliga 24 aktier.
    */

    let scanned=0;

    let skipped=0;


    results=
      T
        .map(t=>{

          let raw=m[t];

          let a=cl(raw);


          if(a.length<200){

            skipped++;

            return null;
          }


          scanned++;


          return calc(
            t,
            a,
            b
          );

        })
        .filter(Boolean);


    render();


    status.textContent=
      `Klart – ${results.length} aktier analyserade`;


    /*
      Om ingen aktie kunde analyseras
      ska det synas tydligt.
    */

    if(results.length===0){

      list.innerHTML=`

        <div class="error">

          Ingen aktie kunde analyseras.
          Kontrollera att stocks.json
          innehåller minst 200 datapunkter
          per aktie.

        </div>

      `;

    }

  }


  catch(e){

    console.error(
      "Scanner error:",
      e
    );


    status.textContent=
      "Fel: " + e.message;


    status.className=
      "status error";


    document.getElementById(
      "list"
    ).innerHTML=`

      <div class="error">

        <b>Scanning misslyckades</b><br><br>

        ${e.message}

      </div>

    `;
  }
}


/* --------------------------------------------------
   Knapp
-------------------------------------------------- */

document
  .getElementById("scan")
  .onclick=run;


/*
  Kör automatiskt när sidan öppnas.
*/

run();

</script>

</body>
</html>
