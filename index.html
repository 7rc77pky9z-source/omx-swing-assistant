<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OMX Swing Scanner v0.6.2</title>

<style>

body {
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f2f2f2;
padding:15px;
}

.card {
background:white;
padding:15px;
margin-bottom:15px;
border-radius:15px;
}

button {
width:100%;
padding:14px;
font-size:17px;
border-radius:10px;
background:#222;
color:white;
border:0;
}

.result {
background:white;
padding:12px;
margin-top:10px;
border-radius:10px;
}

.buy {
color:green;
font-weight:bold;
}

.watch {
color:#b88600;
font-weight:bold;
}

.wait {
color:red;
font-weight:bold;
}

.status {
font-size:14px;
color:#555;
}

</style>

</head>


<body>


<h1>📈 OMX Swing Scanner v0.6.2</h1>


<div class="card">

<h2>OMXS30 Scanner</h2>

<button onclick="scanMarket()">
🔎 Scanna OMXS30
</button>

<p id="status" class="status">
Redo
</p>

</div>


<div class="card">

<h2>Resultat</h2>

<div id="results">
Ingen scanning gjord
</div>

</div>



<script>


// =====================
// DEL 1
// Aktielista
// =====================


const stocks = [

"ABB.ST",
"ALFA.ST",
"ASSA-B.ST",
"ATCO-A.ST",
"AZN.ST",
"BOL.ST",
"ELUX-B.ST",
"ERIC-B.ST",
"EVO.ST",
"HEXA-B.ST",
"HM-B.ST",
"INVE-B.ST",
"KINV-B.ST",
"NDA-SE.ST",
"SAND.ST",
"SCA-B.ST",
"SEB-A.ST",
"SHB-A.ST",
"SINCH.ST",
"SKF-B.ST",
"SWED-A.ST",
"TELIA.ST",
"TEL2-B.ST",
"VOLV-B.ST"

];
// =====================
// DEL 2
// Yahoo data + indikatorer
// =====================


async function getStockData(ticker){


let url =
"https://query1.finance.yahoo.com/v8/finance/chart/"
+ticker+
"?range=1y&interval=1d";


let response =
await fetch(url);


let json =
await response.json();


let result =
json.chart.result[0];


let closes =
result.indicators.quote[0]
.close
.filter(x=>x!==null);



let price =
closes[closes.length-1];


let ma50 =
average(
closes.slice(-50)
);


let ma200 =
average(
closes.slice(-200)
);


let rsi =
calculateRSI(
closes,
14
);



let old =
closes[closes.length-126];


let sixMonth =
((price-old)/old)*100;



return {

price,
ma50,
ma200,
rsi,
sixMonth

};


}



function average(values){

let sum=0;


for(let i=0;i<values.length;i++){

sum+=values[i];

}


return sum/values.length;

}





function calculateRSI(data,period){


let gain=0;

let loss=0;



for(
let i=data.length-period;
i<data.length;
i++
){


let change =
data[i]-data[i-1];


if(change>0){

gain+=change;

}
else{

loss-=change;

}


}


let avgGain =
gain/period;


let avgLoss =
loss/period;



if(avgLoss===0){

return 100;

}


let rs =
avgGain/avgLoss;


return 100-(100/(1+rs));

}




async function getIndexData(){


let url =
"https://query1.finance.yahoo.com/v8/finance/chart/%5EOMXS30?range=1y&interval=1d";


let response =
await fetch(url);


let json =
await response.json();


let closes =
json.chart.result[0]
.indicators.quote[0]
.close
.filter(x=>x!==null);



let old =
closes[closes.length-126];


let latest =
closes[closes.length-1];


return ((latest-old)/old)*100;


}
// =====================
// DEL 3
// Scanner + Swing Score
// =====================


async function scanMarket(){


let resultsDiv =
document.getElementById("results");


let status =
document.getElementById("status");


status.innerHTML =
"Startar scanning...";


resultsDiv.innerHTML =
""



let index6m =
await getIndexData();



let results=[];



for(let i=0;i<stocks.length;i++){


let stock =
stocks[i];


status.innerHTML =
"Analyserar "
+(i+1)+
"/"+
stocks.length+
" : "+
stock;



try{


let data =
await getStockData(stock);



let score =
calculateScore(
data,
index6m
);



results.push({

stock:stock,
score:score.score,
signal:score.signal,
price:data.price,
rsi:data.rsi,
ma50:data.ma50,
ma200:data.ma200

});


}

catch(error){

console.log(
stock+
" misslyckades"
);

}


}



results.sort(
(a,b)=>b.score-a.score
);



status.innerHTML =
"Klart - "+
results.length+
" aktier analyserade";



resultsDiv.innerHTML="";



results.forEach(r=>{


let css =
"wait";


if(r.score>=85){

css="buy";

}

else if(r.score>=70){

css="watch";

}



resultsDiv.innerHTML +=

`

<div class="result">

<b>${r.stock}</b>

<br>

Score:
<b>${r.score}/100</b>

<br>

<span class="${css}">
${r.signal}
</span>

<br><br>

Kurs:
${r.price.toFixed(2)}

<br>

RSI:
${r.rsi.toFixed(1)}

<br>

MA50:
${r.ma50.toFixed(2)}

<br>

MA200:
${r.ma200.toFixed(2)}

</div>

`;

});


}





function calculateScore(data,index6m){


let score=0;



let price =
data.price;



// Trend

if(price>data.ma200){

score+=25;

}



if(data.ma50>data.ma200){

score+=10;

}



// RSI

if(data.rsi<35){

score+=15;

}

else if(data.rsi<45){

score+=8;

}



// Relativ styrka

let relative =
data.sixMonth-index6m;



if(relative>=10){

score+=25;

}

else if(relative>=5){

score+=15;

}

else if(relative>=0){

score+=8;

}



// Momentum

if(price>data.ma50){

score+=10;

}



if(score>100){

score=100;

}



let signal;



if(score>=85){

signal="🟢 KÖP";

}

else if(score>=70){

signal="🟡 BEVAKA";

}

else{

signal="🔴 AVVAKTA";

}



return {

score,
signal

};


}


</script>


</body>

</html>
